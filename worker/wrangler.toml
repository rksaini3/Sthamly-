# Sthamly AI Worker: Cloudflare config (dev aur production)
# Secrets yahan NAHI. Woh `wrangler secret put <NAME> --env <env>` se set hote hain.
# Dev Worker ka naam: sthamly-api-dev. Production abhi placeholder hai.

name = "sthamly-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

[observability]
enabled = true

# ------------------------------------------------------------------
# Top-level (bina --env ke deploy): dev values
# ------------------------------------------------------------------
[vars]
ENVIRONMENT = "dev"
SUPABASE_URL = "https://fdgzhtuwxtbcodbefbmt.supabase.co"
ALLOWED_ORIGINS = "http://localhost:5173,https://localhost,https://web-ip0tyafb0-rajasaini22086-7683s-projects.vercel.app"
IMAGE_MODEL = "gemini-2.5-flash-image"
LIVE_MODEL = "NOT-SET-YET"
DAILY_BUDGET_INR = "200"
LIVE_MAX_SECONDS_PER_SESSION = "900"

[[kv_namespaces]]
binding = "STATE"
id = "026d5a6e740d4345b1d6032f0234ba20"

[triggers]
crons = ["*/15 * * * *"]

# ------------------------------------------------------------------
# DEV: wrangler deploy --env dev
# ------------------------------------------------------------------
[env.dev]
name = "sthamly-api-dev"
workers_dev = true

[env.dev.vars]
ENVIRONMENT = "dev"
SUPABASE_URL = "https://fdgzhtuwxtbcodbefbmt.supabase.co"
ALLOWED_ORIGINS = "http://localhost:5173,https://localhost,https://web-ip0tyafb0-rajasaini22086-7683s-projects.vercel.app"
IMAGE_MODEL = "gemini-2.5-flash-image"
LIVE_MODEL = "NOT-SET-YET"
DAILY_BUDGET_INR = "200"
LIVE_MAX_SECONDS_PER_SESSION = "900"

[[env.dev.kv_namespaces]]
binding = "STATE"
id = "026d5a6e740d4345b1d6032f0234ba20"

[env.dev.triggers]
crons = ["*/15 * * * *"]

[env.dev.observability]
enabled = true

# ------------------------------------------------------------------
# PRODUCTION: abhi use nahi. Alag Supabase project aur KV banane ke baad bharein.
# ------------------------------------------------------------------
[env.production]
name = "sthamly-api"
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://REPLACE-WITH-PROD-PROJECT.supabase.co"
ALLOWED_ORIGINS = "https://REPLACE-WITH-PROD-WEB-DOMAIN"
IMAGE_MODEL = "gemini-2.5-flash-image"
LIVE_MODEL = "NOT-SET-YET"
DAILY_BUDGET_INR = "2000"
LIVE_MAX_SECONDS_PER_SESSION = "900"

[[env.production.kv_namespaces]]
binding = "STATE"
id = "REPLACE-WITH-PROD-KV-ID"

[env.production.triggers]
crons = ["*/15 * * * *"]

[env.production.observability]
enabled = true