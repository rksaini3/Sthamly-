# Sthamly AI Worker: Cloudflare config.
# Secrets yahan NAHI. Woh Cloudflare dashboard (Variables and Secrets → Secret) ya
# `wrangler secret put <NAME>` se set hote hain.
# Deploy ka ek hi raasta hai: GitHub `main` par Cloudflare ka Git build (`npx wrangler deploy`).
# Worker ka naam live Worker se milta hai: `sthamly`.

name = "sthamly"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

[observability]
enabled = true

# Workers AI (image generation). Koi API key nahi, sirf binding.
[ai]
binding = "AI"

# Non-secret vars. Yahan jo likha hai wo har deploy par dashboard ki value ko overwrite karta hai,
# isliye value badalni ho to yahin badlein.
[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://fdgzhtuwxtbcodbefbmt.supabase.co"
ALLOWED_ORIGINS = "http://localhost:5173,https://localhost,https://sthamly.com,https://www.sthamly.com,https://web-ip0tyafb0-rajasaini22086-7683s-projects.vercel.app"
# Image ka model worker/src/providers/image.ts mein fixed hai. Yahan ki value sirf jaankari ke liye hai.
IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"
# TODO: live voice model ka sahi naam yahan daalein (abhi placeholder hai, isliye live voice band rahega).
LIVE_MODEL = "NOT-SET-YET"
DAILY_BUDGET_INR = "200"
LIVE_MAX_SECONDS_PER_SESSION = "900"

[[kv_namespaces]]
binding = "STATE"
id = "026d5a6e740d4345b1d6032f0234ba20"

[triggers]
crons = ["*/15 * * * *"]